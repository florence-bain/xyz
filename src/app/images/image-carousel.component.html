<!-- Carousel Container -->
<div class="relative w-full aspect-[16/9]">
  <!-- Slide Container: Uses transform for smooth sliding -->
  <div
    class="flex transition-transform duration-500 ease-in-out h-full"
    [style.transform]="'translateX(-' + currentSlideIndex() * 100 + '%)'"
  >
    <div
      *ngFor="let image of images; trackBy: trackByUrl"
      class="flex-shrink-0 w-full h-full"
    >
      <!-- Image -->
      <img
        [src]="image.url"
        [alt]="image.alt"
        class="w-full h-full object-cover"
        loading="lazy"
        width="1024"
        height="576"
      />
      <!-- Image Caption -->
      <div
        class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-40 p-2 text-white text-xs sm:text-sm font-light"
      >
      </div>
    </div>
  </div>

  <!-- Navigation Buttons -->
  <button
    (click)="prevSlide()"
    class="absolute top-1/2 left-2 sm:left-4 transform -translate-y-1/2 bg-black/30 text-white p-2 sm:p-3 rounded-full hover:bg-black/60 transition duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-300 z-10"
    aria-label="Previous Slide"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15 19l-7-7 7-7"
      />
    </svg>
  </button>

  <button
    (click)="nextSlide()"
    class="absolute top-1/2 right-2 sm:right-4 transform -translate-y-1/2 bg-black/30 text-white p-2 sm:p-3 rounded-full hover:bg-black/60 transition duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-300 z-10"
    aria-label="Next Slide"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M9 5l7 7-7 7"
      />
    </svg>
  </button>

  <!-- Dot Indicators -->
  <div
    class="absolute bottom-4 left-0 right-0 flex justify-center space-x-2 z-10"
  >
    <button
      *ngFor="let image of images; let i = index"
      (click)="goToSlide(i)"
      [attr.aria-label]="'Go to slide ' + (i + 1)"
      class="w-2.5 h-2.5 rounded-full transition-all duration-300 ease-in-out"
      [ngClass]="{
        'bg-white ring-2 ring-indigo-500 w-3 h-3': i === currentSlideIndex(),
        'bg-gray-400/80 hover:bg-white/80': i !== currentSlideIndex()
      }"
    ></button>
  </div>
</div>
